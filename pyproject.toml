[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "armkit"
version = "0.1.0"
description = "A small documented wrapper around PyBullet for a simulated robot arm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pybullet>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
